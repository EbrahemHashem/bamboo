<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind — 187N Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/components.css">

  <style>
    .mind-wrap {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      height: calc(100vh - 160px);
      min-height: 500px;
    }
    .mind-col {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .mind-col .head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .mind-col .head .title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .mind-col .body { flex: 1; overflow-y: auto; padding: 8px; }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 6px 10px;
      box-sizing: border-box;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }

    .tree-node { font-family: var(--font-mono); font-size: 11px; }
    .tree-folder {
      padding: 4px 6px;
      cursor: pointer;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: var(--radius-sm);
      user-select: none;
    }
    .tree-folder:hover { background: rgba(0,255,136,0.04); }
    .tree-folder .chev {
      color: var(--text-muted);
      transition: transform 0.15s;
      font-size: 9px;
      width: 10px;
      text-align: center;
    }
    .tree-folder.open .chev { transform: rotate(90deg); }
    .tree-folder .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-folder .count { color: var(--text-muted); font-size: 9px; opacity: 0.5; }
    .tree-children { margin-left: 14px; display: none; border-left: 1px solid rgba(0,255,136,0.08); padding-left: 4px; }
    .tree-folder.open + .tree-children { display: block; }
    .tree-file {
      padding: 3px 6px;
      cursor: pointer;
      color: var(--text-sub);
      font-size: 10.5px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-file:hover { background: rgba(0,255,136,0.05); color: var(--text); }
    .tree-file.active { background: rgba(0,255,136,0.12); color: var(--accent); }

    /* View tabs */
    .view-tabs {
      display: flex;
      gap: 2px;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .view-tab {
      flex: 1;
      padding: 6px 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    .view-tab:hover { color: var(--text); }
    .view-tab.active { color: var(--accent); border-color: var(--accent); background: rgba(0,255,136,0.06); }

    /* Graph view */
    .graph-wrap {
      flex: 1; position: relative;
      background: var(--bg);
      overflow: hidden;
      min-height: 400px;
    }
    .graph-svg { width: 100%; height: 100%; display: block; cursor: grab; }
    .graph-svg:active { cursor: grabbing; }
    .graph-svg .link { stroke: rgba(0,255,136,0.12); stroke-width: 0.7; }
    .graph-svg .link.highlight { stroke: var(--accent); stroke-width: 1.3; stroke-opacity: 0.8; }
    .graph-svg .node { cursor: pointer; transition: fill 0.15s; }
    .graph-svg .node:hover { stroke: var(--accent); stroke-width: 2; }
    .graph-svg .node.active { stroke: var(--accent); stroke-width: 2.5; filter: drop-shadow(0 0 6px var(--accent)); }
    .graph-svg .node-label {
      font-family: var(--font-mono); font-size: 9px; pointer-events: none;
      fill: var(--text-muted); opacity: 0;
      transition: opacity 0.15s;
    }
    .graph-svg .node:hover + .node-label, .graph-svg .node.active + .node-label { opacity: 1; fill: var(--text); }

    .graph-controls {
      position: absolute; top: 8px; right: 8px;
      display: flex; gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
    }
    .graph-btn {
      background: transparent; border: none; color: var(--text-muted);
      font-family: var(--font-mono); font-size: 10px;
      padding: 4px 8px; cursor: pointer; border-radius: var(--radius-sm);
    }
    .graph-btn:hover { background: rgba(0,255,136,0.06); color: var(--accent); }

    .graph-stats {
      position: absolute; bottom: 8px; left: 10px;
      font-family: var(--font-mono); font-size: 9px;
      color: var(--text-muted); letter-spacing: 1px;
      pointer-events: none;
    }

    /* Note view */
    .note-meta {
      padding: 10px 16px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .note-meta .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note-body {
      padding: 20px 28px;
      overflow-y: auto;
      flex: 1;
    }
    .md-render {
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-sub);
    }
    .md-render h1, .md-render h2, .md-render h3 {
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 500;
      margin: 24px 0 12px;
      line-height: 1.3;
    }
    .md-render h1 { font-size: 24px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .md-render h2 { font-size: 18px; }
    .md-render h3 { font-size: 15px; }
    .md-render h1:first-child, .md-render h2:first-child { margin-top: 0; }
    .md-render p { margin: 10px 0; }
    .md-render code {
      background: rgba(0,255,136,0.06);
      color: var(--accent);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .md-render pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
    }
    .md-render pre code { background: none; color: var(--text-sub); padding: 0; }
    .md-render ul, .md-render ol { margin: 10px 0; padding-left: 20px; }
    .md-render li { margin: 4px 0; }
    .md-render a { color: var(--accent); text-decoration: none; }
    .md-render a:hover { text-decoration: underline; }
    .md-render blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 14px;
      color: var(--text-muted);
      margin: 12px 0;
    }
    .md-render hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .md-render table { border-collapse: collapse; margin: 12px 0; font-size: 13px; }
    .md-render th, .md-render td { padding: 6px 10px; border: 1px solid var(--border); }
    .md-render th { background: rgba(0,255,136,0.04); color: var(--text); font-weight: 500; }
    .md-render .wikilink {
      color: var(--accent);
      background: rgba(0,255,136,0.06);
      padding: 0 4px;
      border-radius: 3px;
    }
    .md-render .wikilink::before { content: '[['; opacity: 0.5; }
    .md-render .wikilink::after { content: ']]'; opacity: 0.5; }
    .md-render .frontmatter {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 16px;
      white-space: pre;
    }

    .empty-hint {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-hint .ic { font-size: 32px; opacity: 0.3; margin-bottom: 12px; }
    .empty-hint .msg { font-size: 13px; }

    @media (max-width: 900px) {
      .mind-wrap { grid-template-columns: 1fr; height: auto; }
      .mind-col:first-child { max-height: 320px; }
    }
  </style>
</head>
<body>
  <div class="top-glow"></div>
  <div class="perspective-grid"></div>
  <div class="offline-banner">Bridge Offline</div>

  <div class="app">
    <button class="nav-toggle"><span></span><span></span><span></span></button>
    <div class="sidebar-overlay"></div>
    <nav class="sidebar"></nav>

    <main class="main">
      <div class="page-header fade-up">
        <div>
          <h1>Mind</h1>
          <div class="subtitle" id="vaultLabel">Obsidian vault browser</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="loadTree()">Refresh</button>
      </div>

      <div class="mind-wrap fade-up fade-up-1">
        <!-- Left: Tree + Search (altijd zichtbaar) -->
        <div class="mind-col">
          <div class="head">
            <input class="search-input" id="searchInput" placeholder="Search notes..." />
          </div>
          <div class="body" id="treeContainer">
            <div style="padding: 20px; text-align:center; color:var(--text-muted); font-size:11px;">Laden...</div>
          </div>
        </div>

        <!-- Right: Graph -->
        <div class="mind-col">
          <div class="graph-wrap" id="graphWrap">
            <svg class="graph-svg" id="graphSvg"></svg>
            <div class="graph-controls">
              <button class="graph-btn" onclick="graphZoom(1.25)">+</button>
              <button class="graph-btn" onclick="graphZoom(0.8)">&minus;</button>
              <button class="graph-btn" onclick="graphFit()">fit</button>
            </div>
            <div class="graph-stats" id="graphStats"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    let TREE = null;
    let VAULT_NAME = 'obsidian';
    let ALL_FILES = [];
    let CURRENT_PATH = null;
    let GRAPH_DATA = null;
    let GRAPH_INITIALIZED = false;
    let graphSim = null;
    let graphZoomBehavior = null;
    let graphG = null;

    (async () => {
      await MC.init();
      renderNav('mind');
      initMobileNav();
      await loadTree();
      setupSearch();
      initGraph();
    })();

    async function loadTree() {
      const data = await Bridge.fetch('/api/obsidian/tree');
      if (!data || !data.tree) {
        document.getElementById('treeContainer').innerHTML = '<div style="padding:20px; color:var(--text-muted); font-size:11px;">Vault niet gevonden. Check config.</div>';
        return;
      }
      TREE = data.tree;
      VAULT_NAME = data.vaultName || 'obsidian';
      document.getElementById('vaultLabel').textContent = `${VAULT_NAME} — ${countFiles(TREE)} notes`;
      ALL_FILES = flattenFiles(TREE);
      renderTree(TREE, document.getElementById('treeContainer'));
    }

    function countFiles(nodes) {
      let n = 0;
      for (const node of nodes) {
        if (node.type === 'file') n++;
        else n += countFiles(node.children || []);
      }
      return n;
    }

    function flattenFiles(nodes, prefix) {
      const out = [];
      for (const node of nodes) {
        if (node.type === 'file') out.push(node);
        else out.push(...flattenFiles(node.children || []));
      }
      return out;
    }

    function renderTree(nodes, container) {
      container.innerHTML = nodes.map(renderNode).join('');
      container.querySelectorAll('.tree-folder').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          el.classList.toggle('open');
        });
      });
      container.querySelectorAll('.tree-file').forEach(el => {
        el.addEventListener('click', () => openNote(el.dataset.path));
      });
    }

    function renderNode(node, autoOpen) {
      if (node.type === 'folder') {
        const count = countFiles(node.children || []);
        const opened = autoOpen ? 'open' : '';
        return `
          <div class="tree-node">
            <div class="tree-folder ${opened}">
              <span class="chev">&#9656;</span>
              <span class="name">${node.name}</span>
              <span class="count">${count}</span>
            </div>
            <div class="tree-children">
              ${(node.children || []).map(c => renderNode(c)).join('')}
            </div>
          </div>
        `;
      }
      return `<div class="tree-file" data-path="${escapeAttr(node.path)}">${node.name.replace(/\.md$/, '')}</div>`;
    }

    function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

    function openNote(relPath) {
      if (!relPath) return;
      CURRENT_PATH = relPath;
      document.querySelectorAll('.tree-file').forEach(el => el.classList.toggle('active', el.dataset.path === relPath));
      const uriPath = relPath.replace(/\.md$/, '');
      window.location.href = `obsidian://open?vault=${encodeURIComponent(VAULT_NAME)}&file=${encodeURIComponent(uriPath)}`;
    }

    // Minimal markdown renderer — headings, paragraphs, code, lists, links, wikilinks
    function renderMarkdown(md) {
      // Extract frontmatter
      let frontmatter = '';
      let body = md;
      const fmMatch = md.match(/^---\n([\s\S]*?)\n---\n?/);
      if (fmMatch) {
        frontmatter = fmMatch[1];
        body = md.slice(fmMatch[0].length);
      }

      // Escape HTML
      body = body.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      // Code blocks (triple backtick)
      body = body.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);

      // Inline code
      body = body.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Headings
      body = body.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
      body = body.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
      body = body.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
      body = body.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
      body = body.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
      body = body.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

      // Horizontal rule
      body = body.replace(/^---$/gm, '<hr>');

      // Bold & italic
      body = body.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      body = body.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');

      // Wikilinks [[page]]
      body = body.replace(/\[\[([^\]]+)\]\]/g, (_, l) => {
        const parts = l.split('|');
        const label = parts[1] || parts[0];
        return `<span class="wikilink">${label}</span>`;
      });

      // Markdown links [text](url)
      body = body.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

      // Blockquotes
      body = body.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');

      // Lists — super basic: consecutive lines starting with - or *
      body = body.replace(/^([\-\*]\s+.+(?:\n[\-\*]\s+.+)*)/gm, (m) => {
        const items = m.split('\n').map(l => l.replace(/^[\-\*]\s+/, ''));
        return '<ul>' + items.map(i => `<li>${i}</li>`).join('') + '</ul>';
      });
      body = body.replace(/^(\d+\.\s+.+(?:\n\d+\.\s+.+)*)/gm, (m) => {
        const items = m.split('\n').map(l => l.replace(/^\d+\.\s+/, ''));
        return '<ol>' + items.map(i => `<li>${i}</li>`).join('') + '</ol>';
      });

      // Paragraphs — wrap non-block lines
      body = body.split(/\n\n+/).map(chunk => {
        if (/^<(h\d|ul|ol|pre|blockquote|hr|table)/.test(chunk.trim())) return chunk;
        if (!chunk.trim()) return '';
        return '<p>' + chunk.replace(/\n/g, '<br>') + '</p>';
      }).join('\n');

      const fm = frontmatter ? `<div class="frontmatter">${frontmatter.replace(/</g,'&lt;')}</div>` : '';
      return fm + body;
    }

    async function initGraph() {
      GRAPH_INITIALIZED = true;
      const svgEl = document.getElementById('graphSvg');
      const wrap = document.getElementById('graphWrap');
      const stats = document.getElementById('graphStats');
      stats.textContent = 'Loading graph…';

      const data = await Bridge.fetch('/api/obsidian/graph');
      if (!data || !data.nodes || !data.nodes.length) {
        stats.textContent = 'No graph data';
        GRAPH_INITIALIZED = false;
        return;
      }
      GRAPH_DATA = data;

      const width = wrap.clientWidth;
      const height = wrap.clientHeight || 500;

      const svg = d3.select(svgEl).attr('viewBox', `0 0 ${width} ${height}`);
      svg.selectAll('*').remove();

      // Filter out orphans OR show them as disconnected — we'll show all but cluster
      const nodes = data.nodes.map(n => ({ ...n }));
      const edges = data.edges.map(e => ({ source: e.source, target: e.target }));

      // Root folder → color palette (mono-accent variations)
      const folderHue = (folder) => {
        const root = (folder || '/').split('/')[0] || '/';
        // deterministic hash
        let h = 0;
        for (let i = 0; i < root.length; i++) h = (h * 31 + root.charCodeAt(i)) & 0xffff;
        const hue = 120 + (h % 80) - 40; // range 80-200, centered on green
        return `hsl(${hue}, ${60}%, ${55}%)`;
      };

      graphZoomBehavior = d3.zoom()
        .scaleExtent([0.1, 8])
        .on('zoom', (e) => graphG.attr('transform', e.transform));
      svg.call(graphZoomBehavior);

      graphG = svg.append('g');

      const link = graphG.append('g')
        .selectAll('line')
        .data(edges)
        .join('line')
        .attr('class', 'link');

      const nodeG = graphG.append('g')
        .selectAll('g')
        .data(nodes)
        .join('g');

      const radius = d => Math.max(2, Math.min(12, 2 + Math.sqrt(d.connections || 0) * 1.5));

      nodeG.append('circle')
        .attr('class', 'node')
        .attr('r', radius)
        .attr('fill', d => d.connections > 0 ? folderHue(d.folder) : 'rgba(255,255,255,0.12)')
        .attr('stroke', 'rgba(0,0,0,0.4)')
        .on('click', (e, d) => {
          svg.selectAll('.node.active').classed('active', false);
          e.currentTarget.classList.add('active');
          link.classed('highlight', l => l.source.id === d.id || l.target.id === d.id);
          openNote(d.path);
        });

      nodeG.append('text')
        .attr('class', 'node-label')
        .attr('dx', 8)
        .attr('dy', 3)
        .text(d => d.label);

      graphSim = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(edges).id(d => d.id).distance(40).strength(0.6))
        .force('charge', d3.forceManyBody().strength(-60))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collide', d3.forceCollide().radius(d => radius(d) + 2))
        .on('tick', () => {
          link
            .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
          nodeG.attr('transform', d => `translate(${d.x},${d.y})`);
        });

      // drag handler
      const drag = d3.drag()
        .on('start', (e, d) => {
          if (!e.active) graphSim.alphaTarget(0.3).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => {
          if (!e.active) graphSim.alphaTarget(0);
          d.fx = null; d.fy = null;
        });
      nodeG.select('circle').call(drag);

      stats.textContent = `${nodes.length} notes · ${edges.length} links · ${nodes.filter(n => n.connections > 0).length} connected`;

      // cool down faster for initial layout
      setTimeout(() => graphSim.alphaTarget(0), 3500);
    }

    function graphZoom(factor) {
      if (!graphZoomBehavior) return;
      const svg = d3.select('#graphSvg');
      svg.transition().duration(250).call(graphZoomBehavior.scaleBy, factor);
    }

    function graphFit() {
      if (!graphZoomBehavior) return;
      const svg = d3.select('#graphSvg');
      svg.transition().duration(400).call(graphZoomBehavior.transform, d3.zoomIdentity);
    }

    function setupSearch() {
      const input = document.getElementById('searchInput');
      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        if (!q) {
          renderTree(TREE, document.getElementById('treeContainer'));
          return;
        }
        const matches = ALL_FILES.filter(f => f.name.toLowerCase().includes(q) || f.path.toLowerCase().includes(q));
        document.getElementById('treeContainer').innerHTML = matches.slice(0, 100).map(f =>
          `<div class="tree-file" data-path="${escapeAttr(f.path)}" title="${escapeAttr(f.path)}">${f.name.replace(/\.md$/, '')}</div>`
        ).join('') || '<div style="padding:20px; color:var(--text-muted); font-size:11px;">Geen matches</div>';
        document.querySelectorAll('#treeContainer .tree-file').forEach(el => {
          el.addEventListener('click', () => openNote(el.dataset.path));
        });
      });
    }
  </script>
</body>
</html>
