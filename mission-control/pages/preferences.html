<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preferences — 187N Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div class="top-glow"></div>
  <div class="perspective-grid"></div>
  <div class="offline-banner">Bridge Offline — Cached Data</div>
  <div class="app">
    <button class="nav-toggle"><span></span><span></span><span></span></button>
    <div class="sidebar-overlay"></div>
    <nav class="sidebar"></nav>
    <main class="main">
      <div class="page-header fade-up">
        <div>
          <h1>Preferences</h1>
          <div class="subtitle">Dashboard appearance and behavior settings</div>
        </div>
      </div>
      <div class="fade-up fade-up-1">
        
<div class="section" style="max-width:600px;">
  <div class="card" style="padding:24px;">
    <div style="margin-bottom:20px;">
      <div class="label" style="margin-bottom:8px;">Theme</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm">Dark (Default)</button>
        <button class="btn btn-ghost btn-sm" disabled>Light (Coming Soon)</button>
      </div>
    </div>
    <div style="margin-bottom:20px;">
      <div class="label" style="margin-bottom:8px;">Language</div>
      <select class="input" style="width:200px;">
        <option>English</option>
        <option>Nederlands</option>
      </select>
    </div>
    <div style="margin-bottom:20px;">
      <div class="label" style="margin-bottom:8px;">Notifications</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="toggle active" onclick="this.classList.toggle('active')"></div>
        <span style="font-size:13px;color:var(--text-sub);">Show toast notifications</span>
      </div>
    </div>
    <div>
      <div class="label" style="margin-bottom:8px;">Auto-refresh</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="toggle active" onclick="this.classList.toggle('active')"></div>
        <span style="font-size:13px;color:var(--text-sub);">Auto-refresh dashboard data every 30s</span>
      </div>
    </div>
  </div>
</div>
      </div>
    </main>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    (async () => {
      await MC.init();
      renderNav('preferences');
      initMobileNav();
    })();
  </script>
</body>
</html>
