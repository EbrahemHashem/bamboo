<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity — 187N Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div class="top-glow"></div>
  <div class="perspective-grid"></div>
  <div class="offline-banner">Bridge Offline — Cached Data</div>
  <div class="app">
    <button class="nav-toggle"><span></span><span></span><span></span></button>
    <div class="sidebar-overlay"></div>
    <nav class="sidebar"></nav>
    <main class="main">
      <div class="page-header fade-up">
        <div>
          <h1>Activity</h1>
          <div class="subtitle">Recent agent activity and system events</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="loadActivity()">Refresh</button>
      </div>
      <div class="fade-up fade-up-1">
        <div class="section">
          <div class="section-head">
            <div class="section-title">Recent Activity</div>
            <div class="section-count" id="activityCount">0 events</div>
          </div>
          <div class="card" id="activityList">
            <div class="feed" id="feedItems">
              <div class="skeleton-item"><div class="skeleton-line" style="width:70%;height:14px;margin-bottom:8px;"></div><div class="skeleton-line" style="width:30%;height:10px;"></div></div>
              <div class="skeleton-item"><div class="skeleton-line" style="width:60%;height:14px;margin-bottom:8px;"></div><div class="skeleton-line" style="width:25%;height:10px;"></div></div>
              <div class="skeleton-item"><div class="skeleton-line" style="width:80%;height:14px;margin-bottom:8px;"></div><div class="skeleton-line" style="width:35%;height:10px;"></div></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    (async () => {
      await MC.init();
      renderNav('activity');
      initMobileNav();
      loadActivity();
    })();

    async function loadActivity() {
      const el = document.getElementById('feedItems');

      // Try to fetch from bridge first
      const data = await Bridge.fetch('/api/activity');
      let events;

      if (data && data.events && data.events.length > 0) {
        events = data.events;
      } else {
        // Demo data
        events = [
          { icon: '&#9889;', text: '<strong>Content Agent</strong> completed carousel generation', time: '2 min ago' },
          { icon: '&#9650;', text: '<strong>Ad Manager</strong> optimized 3 campaigns', time: '15 min ago' },
          { icon: '&#8634;', text: '<strong>Cron</strong> morning-brief executed successfully', time: '1h ago' },
          { icon: '&#9998;', text: '<strong>Research Bot</strong> analyzed 5 competitors', time: '2h ago' },
          { icon: '&#10003;', text: '<strong>System</strong> health check passed', time: '3h ago' },
        ];
      }

      el.innerHTML = events.map(e => `
        <div class="feed-item">
          <div class="feed-icon">${e.icon}</div>
          <div class="feed-content">
            <div class="feed-text">${e.text}</div>
            <div class="feed-time">${e.time}</div>
          </div>
        </div>
      `).join('');

      document.getElementById('activityCount').textContent = `${events.length} events`;
    }
  </script>
</body>
</html>
